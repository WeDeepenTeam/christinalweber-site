  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .page-header {

      font-size: clamp(2rem, 4vw, 3rem); line-height: 1.15; margin-bottom: 12px;
    }
    .page-header p { color: var(--aap-text-muted); font-size: 1.05rem; }
    .booking {
      max-width: 1000px; margin: 0 auto; padding: 0 16px 48px;
    }
    .booking iframe {
      display: block; width: 100%; height: 900px; border: 0;
      border-radius: 12px; background: #fff;
      box-shadow: var(--aap-shadow);
    }
    .booking__fallback {
      text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--aap-text-muted);
    }
    .booking__fallback a { color: var(--aap-accent); }
    @media (max-width: 600px) {

      .booking iframe { height: 1100px; border-radius: 8px; }
